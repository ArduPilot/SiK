name: test regression

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install sdcc
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      - name: test build
        shell: bash
        run: |
          tests/test_build.sh

      - name: Archive build binaries
        uses: actions/upload-artifact@v4
        with:
          name: SiK build
          path: |
           Firmware/dst
          retention-days: 90
